server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Assets con hash de Vite: caché inmutable de 1 año
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html siempre revalidado para reflejar despliegues recientes
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA para BrowserRouter (/folder/:id, /tables/:shortCode, /admin/*, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
